name: CI

# Verifies the build on every push and pull request. GitHub's runners have full
# access to Maven Central, so this is the authoritative answer to "does it compile
# and do the tests pass?"
on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  build:
    name: Build, test and package
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile all modules
        run: mvn -B --no-transfer-progress clean compile

      - name: Run unit tests
        run: mvn -B --no-transfer-progress test

      - name: Package (skip tests, already run)
        run: mvn -B --no-transfer-progress package -DskipTests

      - name: Generate JaCoCo coverage report
        run: mvn -B --no-transfer-progress verify -DskipITs

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: '**/target/site/jacoco/'
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
          if-no-files-found: ignore

  code-quality:
    name: Checkstyle and SpotBugs
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run static analysis
        run: mvn -B --no-transfer-progress verify -Pquality -DskipTests

  docker:
    name: Validate Docker build
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose configuration
        run: docker compose config --quiet

      - name: Build the api-gateway image as a smoke test
        run: docker build -f api-gateway/Dockerfile -t eop/api-gateway:ci .
