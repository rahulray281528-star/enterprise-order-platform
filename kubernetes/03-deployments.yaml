apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-discovery
  namespace: enterprise-platform
  labels:
    app: service-discovery
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-discovery
  template:
    metadata:
      labels:
        app: service-discovery
    spec:
      containers:
        - name: service-discovery
          image: enterprise/service-discovery:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8761
              name: http
          envFrom:
            - configMapRef:
                name: platform-config
            - secretRef:
                name: platform-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          # Liveness restarts a wedged pod; readiness takes it out of the Service
          # until dependencies are actually reachable. They must not be the same probe.
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8761
            initialDelaySeconds: 90
            periodSeconds: 20
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8761
            initialDelaySeconds: 45
            periodSeconds: 10
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: service-discovery
  namespace: enterprise-platform
spec:
  type: ClusterIP
  selector:
    app: service-discovery
  ports:
    - port: 8761
      targetPort: 8761
      name: http
---
