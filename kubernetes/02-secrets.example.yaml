# EXAMPLE ONLY - do not commit real secrets.
#
# Create the real secret out of band, e.g.:
#   kubectl -n enterprise-platform create secret generic platform-secrets \
#     --from-literal=POSTGRES_USER=postgres \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -base64 24)" \
#     --from-literal=JWT_SECRET="$(openssl rand -base64 48)"
#
# In a real cluster this belongs in AWS Secrets Manager or Vault via the
# External Secrets Operator, not in a manifest at all.
apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
  namespace: enterprise-platform
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "change-me-in-a-real-cluster"
  JWT_SECRET: "change-me-min-32-chars-0123456789abcdefghij"
